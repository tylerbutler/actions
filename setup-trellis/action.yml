name: Setup trellis
description: Install and verify an exact trellis release binary
inputs:
  version:
    description: Exact release version, with an optional v prefix (for example 1.3.0)
    required: true
outputs:
  version:
    description: Installed version without the v prefix
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed binary
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install trellis
      id: install
      shell: bash
      env:
        TRELLIS_VERSION: ${{ inputs.version }}
      run: python3 "$GITHUB_ACTION_PATH/install.py"
