name: Trellis release
on:
  workflow_call:
    inputs:
      phase:
        description: all, select, publish, prepare, or complete; split phases reuse the same lifecycle gates
        type: string
        default: all
      release_sha:
        description: Selected immutable merge SHA; required for publish and complete
        type: string
        default: ''
      required_jobs:
        description: JSON array of required caller job IDs (including assembly and consumer proofs)
        type: string
        default: '[]'
      qualification_results:
        description: toJSON(needs) from the caller; every required job must have result success
        type: string
        default: '{}'
      required_targets:
        description: JSON array of native target names in the qualified artifact
        type: string
        default: '[]'
      package_artifact:
        description: Same-run artifact containing trellis-release.json and a package overlay
        type: string
        default: ''
      artifact_paths:
        description: JSON array of allowed overlay directories, relative to working_directory
        type: string
        default: '["priv"]'
      publication_result:
        description: For complete only; actual custom publication job result
        type: string
        default: ''
      tagging_result:
        description: For complete only; actual custom tagging job result
        type: string
        default: ''
      trellis_version:
        description: Exact trellis release version (1.3.0 or newer compatible release)
        required: true
        type: string
      working_directory:
        type: string
        default: '.'
      base:
        type: string
        default: main
      release_branch:
        type: string
        default: release/pending
      release_mode:
        description: hex, git_only, or mixed
        required: true
        type: string
      pre:
        type: string
        default: ''
      set:
        type: string
        default: ''
      bump:
        type: string
        default: ''
      gleam_version:
        description: Required for Hex or mixed publication
        type: string
        default: ''
      erlang_version:
        description: Required for Hex or mixed publication
        type: string
        default: ''
      sbom_package:
        description: Root Hex package to generate and attach a CycloneDX SBOM for; empty disables
        type: string
        default: ''
      licence_audit_version:
        description: Exact native licence_audit stable or prerelease version without v prefix; required with sbom_package
        type: string
        default: ''
    secrets:
      app_id:
        required: false
      app_private_key:
        required: false
      publication_token:
        description: Optional publication token; defaults to the workflow token
        required: false
      hex_api_key:
        required: false
    outputs:
      release_sha:
        description: Selected release PR merge SHA, including a completed retry
        value: ${{ jobs.release.outputs.release_sha }}
      preparation_eligible:
        description: No preceding incomplete release; preparation still applies candidate/manual ownership checks
        value: ${{ jobs.release.outputs.preparation_eligible }}
      publication_state:
        description: none, untracked, pending, failed, or completed
        value: ${{ jobs.release.outputs.publication_state }}
      complete:
        value: ${{ jobs.release.outputs.complete }}

concurrency:
  group: trellis-release-${{ github.repository }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.select.outputs.release_sha }}
      preparation_eligible: ${{ steps.select.outputs.preparation_eligible }}
      publication_state: ${{ steps.publication.outputs.publication_state || steps.select.outputs.publication_state }}
      complete: ${{ steps.publication.outputs.complete || steps.select.outputs.complete }}
    env:
      RELEASE_BASE: ${{ inputs.base }}
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      WORKING_DIRECTORY: ${{ inputs.working_directory }}
      RELEASE_PHASE: ${{ inputs.phase }}
    steps:
      - name: Select trusted release
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          GLEAM_VERSION: ${{ inputs.gleam_version }}
          ERLANG_VERSION: ${{ inputs.erlang_version }}
          SBOM_PACKAGE: ${{ inputs.sbom_package }}
          LICENCE_AUDIT_VERSION: ${{ inputs.licence_audit_version }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          github-token: ${{ secrets.publication_token || github.token }}
          script: |
            // script: select
            const repo = context.repo;
            const base = process.env.RELEASE_BASE;
            const branch = process.env.RELEASE_BRANCH;
            const mode = process.env.RELEASE_MODE;
            const phase = process.env.RELEASE_PHASE || "all";
            if (!["all", "select", "publish", "prepare", "complete"].includes(phase)) {
              throw new Error("Invalid release phase.");
            }
            if (["publish", "complete"].includes(phase)
                && !/^[0-9a-f]{40}$/.test(process.env.EXPECTED_RELEASE_SHA || "")) {
              throw new Error("publish/complete requires the selected release_sha.");
            }
            if (!["hex", "git_only", "mixed"].includes(mode)) throw new Error("Invalid release_mode.");
            if (!base || !branch || base === branch || /[\s~^:?*\\[]/.test(base + branch)
                || base.startsWith("-") || branch.startsWith("-")) throw new Error("Invalid release branches.");
            await exec.getExecOutput("git", ["check-ref-format", "--branch", base]);
            await exec.getExecOutput("git", ["check-ref-format", "--branch", branch]);
            if (["all", "publish"].includes(phase) && mode !== "git_only"
                && (!process.env.GLEAM_VERSION || !process.env.ERLANG_VERSION)) {
              throw new Error("Hex/mixed publication requires gleam_version and erlang_version.");
            }
            if (process.env.SBOM_PACKAGE) {
              if (mode === "git_only" || !/^[a-z][a-z0-9_]*$/.test(process.env.SBOM_PACKAGE)) {
                throw new Error("sbom_package requires a root Hex package name and hex/mixed mode.");
              }
              const version = process.env.LICENCE_AUDIT_VERSION || "";
              if (/\s/.test(version)
                  || !/^\d+\.\d+\.\d+(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?$/.test(version)) {
                throw new Error("SBOM generation requires an exact licence_audit_version.");
              }
            }
            const sameRepo = pr => pr.head.ref === branch && pr.base.ref === base
              && pr.head.repo?.full_name === `${repo.owner}/${repo.repo}`
              && pr.base.repo?.full_name === `${repo.owner}/${repo.repo}`;
            const closed = await github.paginate(github.rest.pulls.list, {
              ...repo, state: "closed", base, sort: "updated", direction: "desc",
            });
            const latest = closed.filter(p => p.merged_at && sameRepo(p))
              .sort((a,b) => Date.parse(b.merged_at) - Date.parse(a.merged_at))[0];
            const state = async sha => {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {...repo, ref: sha});
              const status = statuses.find(s => s.context === "trellis/release")?.state;
              return status === "success" ? "completed" : ["failure", "error"].includes(status) ? "failed"
                : status === "pending" ? "pending" : "untracked";
            };
            const latestState = latest ? await state(latest.merge_commit_sha) : "none";
            core.setOutput("preparation_eligible", String(!latest || latestState === "completed"));
            core.setOutput("publication_state", latestState);
            if (context.eventName === "pull_request") {
              if (context.payload.action !== "closed") {
                if (["publish", "complete"].includes(phase)) throw new Error("Publication requires a closed PR event.");
                return;
              }
              const event = context.payload.pull_request;
              const {data: pr} = await github.rest.pulls.get({...repo, pull_number: event.number});
              if (!pr.merged || !sameRepo(pr)) {
                if (["publish", "complete"].includes(phase)) {
                  throw new Error("Selected PR is no longer a trusted merged release.");
                }
                return;
              }
              if (!/^[0-9a-f]{40}$/.test(pr.merge_commit_sha || "")
                  || pr.merge_commit_sha !== event.merge_commit_sha || !event.merged
                  || !sameRepo(event)) throw new Error("Release event does not match trusted merge state.");
              if (process.env.EXPECTED_RELEASE_SHA && process.env.EXPECTED_RELEASE_SHA !== pr.merge_commit_sha) {
                throw new Error("Selected release_sha does not match the trusted merge.");
              }
              core.setOutput("release_sha", pr.merge_commit_sha);
              const publicationState = await state(pr.merge_commit_sha);
              core.setOutput("publication_state", publicationState);
              if (publicationState === "completed") {
                core.info("Completed release: skip publication and tagging; recover current-base preparation.");
                core.setOutput("complete", "true");
                if (["all", "prepare"].includes(phase)) core.setOutput("prepare", "true");
                return;
              }
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...repo, basehead: `${pr.merge_commit_sha}...${base}`,
              });
              if (!["ahead", "identical"].includes(comparison.status)) {
                throw new Error("Approved merge is not on the configured base.");
              }
              if (!latest || latest.merge_commit_sha !== pr.merge_commit_sha) {
                throw new Error("A newer release exists; do not publish stale release state.");
              }
              if (phase === "prepare") return;
              if (["all", "publish"].includes(phase)) core.setOutput("publish_sha", pr.merge_commit_sha);
              if (["all", "publish", "complete"].includes(phase)) core.setOutput("record_sha", pr.merge_commit_sha);
              if (phase === "select") {
                await github.rest.repos.createCommitStatus({
                  ...repo, sha: pr.merge_commit_sha, context: "trellis/release", state: "pending",
                  description: "Qualification reserved; recover this merge run if interrupted",
                });
                core.setOutput("publication_state", "pending");
              }
            } else if (["push", "workflow_dispatch"].includes(context.eventName)) {
              if (["publish", "complete"].includes(phase)) throw new Error("Publication requires a merged PR event.");
              if (context.ref !== `refs/heads/${base}`) throw new Error("Prepare on the configured base branch.");
              if (context.eventName === "workflow_dispatch") {
                const {data: ref} = await github.rest.git.getRef({...repo, ref: `heads/${base}`});
                const sha = ref.object.sha;
                if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error("Invalid manual reservation base SHA.");
                await github.rest.repos.createCommitStatus({
                  ...repo, sha, context: "trellis/release_request", state: "pending",
                  description: "Manual request reserved before checkout, installation, and preparation",
                });
              }
              if (phase !== "select") core.setOutput("prepare", "true");
            } else {
              throw new Error("Unsupported release event.");
            }
            // end-script

      - name: Validate required qualification jobs
        id: qualification
        if: steps.select.outputs.record_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          REQUIRED_JOBS: ${{ inputs.required_jobs }}
          QUALIFICATION_RESULTS: ${{ inputs.qualification_results }}
          PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
        with:
          script: |
            // script: qualification
            const required = JSON.parse(process.env.REQUIRED_JOBS);
            const results = JSON.parse(process.env.QUALIFICATION_RESULTS);
            if (!Array.isArray(required) || required.some(job => typeof job !== "string" || !job)
                || new Set(required).size !== required.length || !results || Array.isArray(results)
                || typeof results !== "object") throw new Error("Invalid required qualification jobs.");
            if (process.env.PACKAGE_ARTIFACT && required.length === 0) {
              throw new Error("Qualified artifacts require explicit required_jobs.");
            }
            for (const job of required) {
              if (results[job]?.result !== "success") throw new Error(`Required qualification did not succeed: ${job}`);
            }
            // end-script

      - name: Check out approved merge
        if: steps.select.outputs.publish_sha != '' && (inputs.phase == 'all' || inputs.phase == 'publish')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ steps.select.outputs.publish_sha }}
          fetch-depth: 0
          token: ${{ secrets.publication_token || github.token }}
          persist-credentials: false

      - name: Install publication trellis
        if: steps.select.outputs.publish_sha != '' && (inputs.phase == 'all' || inputs.phase == 'publish')
        uses: tylerbutler/actions/setup-trellis@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-trellis@main
        with:
          version: ${{ inputs.trellis_version }}

      - name: Verify checkout and reserve publication
        id: reserve
        if: steps.select.outputs.publish_sha != '' && (inputs.phase == 'all' || inputs.phase == 'publish')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.select.outputs.publish_sha }}
          PUBLICATION_TOKEN: ${{ secrets.publication_token || github.token }}
        with:
          github-token: ${{ secrets.publication_token || github.token }}
          script: |
            // script: reserve-publication
            const sha = process.env.RELEASE_SHA;
            const result = await exec.getExecOutput("git", ["rev-parse", "HEAD"]);
            if (result.stdout.trim() !== sha) throw new Error("Release checkout changed.");
            const origin = (await exec.getExecOutput("git", ["remote", "get-url", "origin"])).stdout.trim();
            const expected = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            if (![expected, `${expected}.git`].includes(origin)) throw new Error("Unexpected checkout origin.");
            const token = process.env.PUBLICATION_TOKEN;
            if (!token || /\s/.test(token)) throw new Error("Publication requires a token without whitespace.");
            const header = "AUTHORIZATION: basic " + Buffer.from(`x-access-token:${token}`).toString("base64");
            core.setSecret(header);
            core.setOutput("git_header", header);
            core.setOutput("git_origin", origin);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, context: "trellis/release", state: "pending",
              description: "Publication and tagging started",
            });
            // end-script

      - name: Download qualified package artifact
        id: download_artifact
        if: steps.select.outputs.publish_sha != '' && inputs.package_artifact != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # ratchet:actions/download-artifact@v6
        with:
          name: ${{ inputs.package_artifact }}
          path: ${{ runner.temp }}/trellis-qualified-package

      - name: Verify and assemble qualified package
        id: assembly
        if: steps.download_artifact.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.select.outputs.publish_sha }}
          REQUIRED_TARGETS: ${{ inputs.required_targets }}
          ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/trellis-qualified-package
        with:
          script: |
            // script: artifact-assemble
            const fs = require("node:fs/promises");
            const path = require("node:path");
            const {createHash} = require("node:crypto");
            const root = process.env.ARTIFACT_DIRECTORY;
            for (const directory of [root, path.join(root, "overlay")]) {
              if (!(await fs.lstat(directory)).isDirectory()) throw new Error("Unsafe artifact directory.");
            }
            const manifestPath = path.join(root, "trellis-release.json");
            if (!(await fs.lstat(manifestPath)).isFile()) throw new Error("Unsafe artifact manifest.");
            const manifest = JSON.parse(await fs.readFile(manifestPath, "utf8"));
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (manifest.schema !== "trellis.qualified_artifact/1" || manifest.repository !== repository
                || manifest.release_sha !== process.env.RELEASE_SHA
                || manifest.run_id !== String(context.runId)
                || manifest.run_attempt !== process.env.GITHUB_RUN_ATTEMPT) {
              throw new Error("Qualified artifact revision/run/attempt does not match this release.");
            }
            const safe = value => typeof value === "string" && value.length > 0
              && !value.includes("\\") && !value.includes("\0") && !path.posix.isAbsolute(value)
              && value.split("/").every(part => part && part !== "." && part !== ".." && part !== ".git");
            const required = JSON.parse(process.env.REQUIRED_TARGETS);
            const allowed = JSON.parse(process.env.ARTIFACT_PATHS);
            if (!Array.isArray(required) || required.length === 0 || required.some(t => !safe(t))
                || new Set(required).size !== required.length
                || !Array.isArray(allowed) || !allowed.length || allowed.some(p => !safe(p))) {
              throw new Error("Require explicit native targets and safe artifact_paths.");
            }
            if (!manifest.targets || Array.isArray(manifest.targets) || typeof manifest.targets !== "object"
                || Object.keys(manifest.targets).length !== required.length
                || required.some(target => !Array.isArray(manifest.targets[target]) || !manifest.targets[target].length)) {
              throw new Error("Missing or unexpected qualified native target.");
            }
            if (!manifest.files || Array.isArray(manifest.files) || typeof manifest.files !== "object"
                || !Object.keys(manifest.files).length) throw new Error("Empty qualified package.");
            const claimed = new Set();
            for (const files of Object.values(manifest.targets)) {
              for (const file of files) {
                if (!safe(file) || !Object.hasOwn(manifest.files, file)) throw new Error("Missing target file.");
                if (claimed.has(file)) throw new Error("Duplicate native target file.");
                claimed.add(file);
              }
            }
            const actual = [];
            const walk = async (directory, prefix = "") => {
              for (const entry of await fs.readdir(directory, {withFileTypes: true})) {
                const name = prefix + entry.name;
                if (!safe(name) || entry.isSymbolicLink()) throw new Error("Unsafe artifact entry.");
                if (entry.isDirectory()) await walk(path.join(directory, entry.name), name + "/");
                else if (entry.isFile()) actual.push(name);
                else throw new Error("Unsupported artifact entry.");
              }
            };
            await walk(path.join(root, "overlay"));
            if (JSON.stringify(actual.sort()) !== JSON.stringify(Object.keys(manifest.files).sort())) {
              throw new Error("Qualified artifact file inventory differs from manifest.");
            }
            const destination = path.resolve(process.env.WORKING_DIRECTORY);
            const workspace = await fs.realpath(process.env.GITHUB_WORKSPACE);
            const resolved = await fs.realpath(destination);
            if (resolved !== destination || (resolved !== workspace && !resolved.startsWith(workspace + path.sep))) {
              throw new Error("Package directory must be inside the checkout without symlinks.");
            }
            const head = await exec.getExecOutput("git", ["rev-parse", "HEAD"]);
            if (head.stdout.trim() !== process.env.RELEASE_SHA) throw new Error("Release checkout changed.");
            for (const file of actual) {
              if (!safe(file) || !allowed.some(p => file.startsWith(p + "/"))
                  || !/^[0-9a-f]{64}$/.test(manifest.files[file])) throw new Error("Unsafe overlay file or digest.");
              const content = await fs.readFile(path.join(root, "overlay", file));
              if (createHash("sha256").update(content).digest("hex") !== manifest.files[file]) {
                throw new Error(`Qualified artifact digest mismatch: ${file}`);
              }
              // Reject checkout symlinks before writing through any existing path component.
              let current = destination;
              for (const part of file.split("/")) {
                current = path.join(current, part);
                try {
                  if ((await fs.lstat(current)).isSymbolicLink()) throw new Error("Unsafe checkout symlink.");
                } catch (error) { if (error.code !== "ENOENT") throw error; }
              }
            }
            for (const file of actual) {
              const target = path.join(destination, file);
              await fs.mkdir(path.dirname(target), {recursive: true});
              await fs.copyFile(path.join(root, "overlay", file), target);
            }
            // end-script

      - name: Setup Hex runtime
        if: steps.select.outputs.publish_sha != '' && inputs.release_mode != 'git_only'
        uses: tylerbutler/actions/setup-gleam@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          version-file: ''
          gleam-version: ${{ inputs.gleam_version }}
          erlang-version: ${{ inputs.erlang_version }}
          working-directory: ${{ inputs.working_directory }}
          run-deps: 'false'
          cache: 'false'
          tools: ''

      - name: Select SBOM package and exact tag
        id: sbom
        if: steps.select.outputs.publish_sha != '' && inputs.sbom_package != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          SBOM_PACKAGE: ${{ inputs.sbom_package }}
        with:
          script: |
            // script: sbom-select
            const name = process.env.SBOM_PACKAGE;
            const read = async args => JSON.parse((await exec.getExecOutput("trellis", args, {
              cwd: process.env.WORKING_DIRECTORY,
            })).stdout);
            const list = await read(["list", "--releasable", "--json"]);
            if (list.schema !== "trellis.list/1" || !Array.isArray(list.packages)) {
              throw new Error("Invalid Trellis package contract.");
            }
            const packages = list.packages.filter(p => p.name === name);
            if (packages.length !== 1 || packages[0].path !== "." || packages[0].lifecycle !== "hex"
                || packages[0].releasable !== true || typeof packages[0].version !== "string") {
              throw new Error("sbom_package must select the root releasable Hex package.");
            }
            const version = packages[0].version;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error("Invalid SBOM package version.");
            }
            const facts = (await exec.getExecOutput("trellis", ["ci", "outputs"], {
              cwd: process.env.WORKING_DIRECTORY,
            })).stdout;
            const lines = facts.match(/^tags=(.*)\r?$/gm) || [];
            if (lines.length !== 1) throw new Error("Missing or duplicate Trellis tags output.");
            const configured = JSON.parse(lines[0].slice("tags=".length));
            if (!Array.isArray(configured) || configured.some(tag => typeof tag !== "string")
                || new Set(configured).size !== configured.length) {
              throw new Error("Invalid Trellis tags output.");
            }
            const tags = [];
            for (const tag of configured) {
              const resolved = await read(["ci", "tag-package", tag, "--json"]);
              if (resolved.schema !== "trellis.ci_tag_package/1" || resolved.tag_kind !== "exact") {
                throw new Error("Invalid Trellis exact tag contract.");
              }
              if (resolved.name === name && resolved.path === "." && resolved.version === version
                  && resolved.tag_version === version) tags.push(tag);
            }
            if (tags.length !== 1 || !/^[0-9A-Za-z][0-9A-Za-z._+-]*$/.test(tags[0])) {
              throw new Error("SBOM requires one exact tag with a filename-safe name.");
            }
            core.setOutput("version", version);
            core.setOutput("tag", tags[0]);
            core.setOutput("path", `priv/${name}.cdx.json`);
            core.setOutput("asset", `${tags[0]}.cdx.json`);
            // end-script

      - name: Install native licence_audit
        if: steps.select.outputs.publish_sha != '' && inputs.sbom_package != ''
        shell: bash
        env:
          LICENCE_AUDIT_VERSION: ${{ inputs.licence_audit_version }}
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/licence-audit.XXXXXX")
          archive="licence_audit-v${LICENCE_AUDIT_VERSION}-x86_64-linux-glibc.tar.gz"
          base="https://github.com/tylerbutler/licence_audit/releases/download/v${LICENCE_AUDIT_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$directory/$archive"
          curl --fail --silent --show-error --location "$base/checksums.txt" -o "$directory/checksums.txt"
          awk -v archive="$archive" '$2 == archive { print }' "$directory/checksums.txt" > "$directory/selected.sha256"
          test "$(wc -l < "$directory/selected.sha256")" -eq 1
          (cd "$directory" && sha256sum --check --strict selected.sha256)
          tar -xOzf "$directory/$archive" "${archive%.tar.gz}/licence_audit" > "$directory/licence_audit"
          chmod +x "$directory/licence_audit"
          "$directory/licence_audit" --version | grep -Fx "$LICENCE_AUDIT_VERSION"
          echo "$directory" >> "$GITHUB_PATH"

      - name: Generate and verify package SBOM
        id: generate_sbom
        if: steps.select.outputs.publish_sha != '' && inputs.sbom_package != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          RELEASE_SHA: ${{ steps.select.outputs.publish_sha }}
          SBOM_PACKAGE: ${{ inputs.sbom_package }}
          SBOM_VERSION: ${{ steps.sbom.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
          SBOM_ASSET: ${{ steps.sbom.outputs.asset }}
          SOURCE_DATE_EPOCH: '0'
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git ls-files --error-unmatch gleam.toml manifest.toml
          git diff --exit-code HEAD
          gleam deps download
          git diff --exit-code HEAD
          mkdir -p priv
          licence_audit sbom --reproducible --output="$SBOM_PATH"
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          document = json.loads(Path(os.environ["SBOM_PATH"]).read_text())
          manifest = tomllib.loads(Path("manifest.toml").read_text())
          project = tomllib.loads(Path("gleam.toml").read_text())
          name, version = os.environ["SBOM_PACKAGE"], os.environ["SBOM_VERSION"]
          if project.get("name") != name or project.get("version") != version:
              raise ValueError("SBOM package does not match the approved manifest")
          if document.get("bomFormat") != "CycloneDX" or document.get("specVersion") != "1.6":
              raise ValueError("Expected CycloneDX 1.6")
          root = document.get("metadata", {}).get("component", {})
          if root.get("name") != name or root.get("version") != version:
              raise ValueError("SBOM root identity mismatch")
          locked = {p["name"]: p for p in manifest["packages"]}
          components = document.get("components", [])
          if len(components) != len(locked) or {p["name"] for p in components} != set(locked):
              raise ValueError("SBOM must include the complete lock inventory")
          required, pending = set(), list(project.get("dependencies", {}))
          while pending:
              dependency = pending.pop()
              if dependency not in required:
                  required.add(dependency)
                  pending.extend(locked[dependency].get("requirements", []))
          for component in components:
              package = locked[component["name"]]
              scope = "required" if component["name"] in required else "optional"
              if component.get("version") != package["version"] or component.get("scope") != scope:
                  raise ValueError("SBOM locked version or dependency scope mismatch")
          PY
          gleam export hex-tarball
          tar -xOf "build/${SBOM_PACKAGE}-${SBOM_VERSION}.tar" contents.tar.gz |
            tar -xzOf - "$SBOM_PATH" | cmp "$SBOM_PATH" -
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code HEAD
          directory=$(mktemp -d "$RUNNER_TEMP/trellis-sbom.XXXXXX")
          cp "$SBOM_PATH" "$directory/$SBOM_ASSET"
          echo "snapshot=$directory/$SBOM_ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish Hex members
        id: publish
        if: steps.select.outputs.publish_sha != '' && inputs.release_mode != 'git_only'
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          HEXPM_API_KEY: ${{ secrets.hex_api_key }}
        run: |
          if [[ -z "$HEXPM_API_KEY" ]]; then
            echo "::error::hex_api_key is required for publication"
            exit 1
          fi
          trellis publish --all-untagged

      - name: Verify published Hex SBOM
        id: hex_sbom
        if: steps.select.outputs.publish_sha != '' && inputs.sbom_package != ''
        shell: bash
        env:
          SBOM_PACKAGE: ${{ inputs.sbom_package }}
          SBOM_VERSION: ${{ steps.sbom.outputs.version }}
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
          SBOM_SNAPSHOT: ${{ steps.generate_sbom.outputs.snapshot }}
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/hex-sbom.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 \
            "https://repo.hex.pm/tarballs/${SBOM_PACKAGE}-${SBOM_VERSION}.tar" -o "$directory/package.tar"
          tar -xOf "$directory/package.tar" contents.tar.gz |
            tar -xzOf - "$SBOM_PATH" | cmp "$SBOM_SNAPSHOT" -

      - name: Tag approved release
        id: tag
        if: steps.select.outputs.publish_sha != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.publication_token || github.token }}
          GITHUB_TOKEN: ${{ secrets.publication_token || github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: http.${{ steps.reserve.outputs.git_origin }}.extraheader
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: http.${{ steps.reserve.outputs.git_origin }}.extraheader
          GIT_CONFIG_VALUE_1: ${{ steps.reserve.outputs.git_header }}
        run: trellis tag create --push --github-release

      - name: Reconcile GitHub Release SBOM
        id: release_sbom
        if: steps.select.outputs.publish_sha != '' && inputs.sbom_package != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.publication_token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.select.outputs.publish_sha }}
          SBOM_TAG: ${{ steps.sbom.outputs.tag }}
          SBOM_ASSET: ${{ steps.sbom.outputs.asset }}
          SBOM_SNAPSHOT: ${{ steps.generate_sbom.outputs.snapshot }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: http.${{ steps.reserve.outputs.git_origin }}.extraheader
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: http.${{ steps.reserve.outputs.git_origin }}.extraheader
          GIT_CONFIG_VALUE_1: ${{ steps.reserve.outputs.git_header }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin "refs/tags/$SBOM_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          directory=$(mktemp -d "$RUNNER_TEMP/release-sbom.XXXXXX")
          gh release view "$SBOM_TAG" --json assets > "$directory/release.json"
          count=$(jq --arg name "$SBOM_ASSET" '[.assets[] | select(.name == $name)] | length' "$directory/release.json")
          if [[ "$count" = 0 ]]; then
            gh release upload "$SBOM_TAG" "$SBOM_SNAPSHOT"
          elif [[ "$count" != 1 ]]; then
            echo "::error::Duplicate SBOM release assets"
            exit 1
          fi
          gh release download "$SBOM_TAG" --pattern "$SBOM_ASSET" --dir "$directory"
          if ! cmp "$SBOM_SNAPSHOT" "$directory/$SBOM_ASSET"; then
            echo "::error::Release SBOM differs from the published Hex package; refusing overwrite"
            exit 1
          fi

      - name: Record publication outcome
        id: publication
        if: always() && steps.select.outputs.record_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.select.outputs.record_sha }}
          TAG_OUTCOME: ${{ inputs.phase == 'complete' && inputs.tagging_result || steps.tag.outcome }}
          PUBLISH_OUTCOME: ${{ inputs.phase == 'complete' && inputs.publication_result || steps.publish.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
          ASSEMBLY_OUTCOME: ${{ steps.assembly.outcome }}
          SBOM_PACKAGE: ${{ inputs.sbom_package }}
          GENERATE_SBOM_OUTCOME: ${{ steps.generate_sbom.outcome }}
          HEX_SBOM_OUTCOME: ${{ steps.hex_sbom.outcome }}
          RELEASE_SBOM_OUTCOME: ${{ steps.release_sbom.outcome }}
        with:
          github-token: ${{ secrets.publication_token || github.token }}
          script: |
            // script: publication-outcome
            const publishOutcome = process.env.PUBLISH_OUTCOME || "";
            const publicationComplete = publishOutcome === "success"
              || (process.env.RELEASE_MODE === "git_only"
                && (process.env.RELEASE_PHASE !== "complete" || ["", "skipped"].includes(publishOutcome)));
            const complete = process.env.TAG_OUTCOME === "success"
              && process.env.QUALIFICATION_OUTCOME === "success"
              && (!process.env.PACKAGE_ARTIFACT || process.env.ASSEMBLY_OUTCOME === "success")
              && publicationComplete
              && (!process.env.SBOM_PACKAGE || [process.env.GENERATE_SBOM_OUTCOME,
                process.env.HEX_SBOM_OUTCOME, process.env.RELEASE_SBOM_OUTCOME].every(o => o === "success"));
            const outcomes = [
              ["Required qualification", process.env.QUALIFICATION_OUTCOME],
              ["Trellis publish", process.env.PUBLISH_OUTCOME],
              ["Trellis tag", process.env.TAG_OUTCOME],
            ];
            if (process.env.PACKAGE_ARTIFACT) outcomes.push(["Qualified package assembly", process.env.ASSEMBLY_OUTCOME]);
            if (process.env.SBOM_PACKAGE) outcomes.push(
              ["Package SBOM", process.env.GENERATE_SBOM_OUTCOME],
              ["Published Hex SBOM", process.env.HEX_SBOM_OUTCOME],
              ["Release SBOM", process.env.RELEASE_SBOM_OUTCOME],
            );
            for (const [name, outcome] of outcomes) {
              core.summary.addHeading(name, 2).addRaw(`Step outcome: \`${outcome || "not run"}\`.\n`);
            }
            await core.summary.write();
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.RELEASE_SHA, context: "trellis/release",
              state: complete ? "success" : "failure",
              description: complete ? "Publication and tagging complete" : "Recover at the approved merge SHA",
            });
            if (complete) core.setOutput("complete", "true");
            core.setOutput("publication_state", complete ? "completed" : "failed");
            if (!complete && process.env.RELEASE_PHASE === "complete") {
              throw new Error("Required release work did not succeed; completion refused.");
            }
            // end-script

      - name: Create preparation App token
        if: steps.select.outputs.prepare == 'true' || (inputs.phase == 'all' && steps.publication.outputs.complete == 'true')
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out current base
        if: steps.select.outputs.prepare == 'true' || (inputs.phase == 'all' && steps.publication.outputs.complete == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Install preparation trellis
        if: steps.select.outputs.prepare == 'true' || (inputs.phase == 'all' && steps.publication.outputs.complete == 'true')
        uses: tylerbutler/actions/setup-trellis@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-trellis@main
        with:
          version: ${{ inputs.trellis_version }}

      - name: Gate and reserve preparation
        id: gate
        if: steps.select.outputs.prepare == 'true' || (inputs.phase == 'all' && steps.publication.outputs.complete == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          PREPARATION_TOKEN: ${{ steps.app.outputs.token }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // script: prepare-gate
            const repo = context.repo;
            const base = process.env.RELEASE_BASE;
            const branch = process.env.RELEASE_BRANCH;
            const sameRepo = pr => pr.head.ref === branch && pr.base.ref === base
              && pr.head.repo?.full_name === `${repo.owner}/${repo.repo}`
              && pr.base.repo?.full_name === `${repo.owner}/${repo.repo}`;
            const closed = await github.paginate(github.rest.pulls.list, {
              ...repo, state: "closed", base, sort: "updated", direction: "desc",
            });
            const latest = closed.filter(pr => pr.merged_at && sameRepo(pr))
              .sort((a,b) => Date.parse(b.merged_at) - Date.parse(a.merged_at))[0];
            const statuses = ref => github.paginate(github.rest.repos.listCommitStatusesForRef, {...repo, ref});
            if (latest && (await statuses(latest.merge_commit_sha))
                .find(s => s.context === "trellis/release")?.state !== "success") {
              core.info("Previous release incomplete or unknown; recover its merge run before preparation.");
              return;
            }
            const open = (await github.paginate(github.rest.pulls.list, {
              ...repo, state: "open", base, head: `${repo.owner}:${branch}`,
            })).filter(sameRepo);
            if (open.length > 1) throw new Error("Multiple pending release PRs.");
            const manual = context.eventName === "workflow_dispatch";
            const reservations = [];
            {
              for await (const page of github.paginate.iterator(github.rest.repos.listCommits, {
                ...repo, sha: base, per_page: 100,
              })) {
                let reached = false;
                for (const commit of page.data) {
                  if ((await statuses(commit.sha))
                      .find(s => s.context === "trellis/release_request")?.state === "pending") {
                    if (!manual) {
                      core.info("Manual request owns preparation, including before PR creation.");
                      return;
                    }
                    reservations.push(commit.sha);
                  }
                  if (commit.sha === latest?.merge_commit_sha) { reached = true; break; }
                }
                if (reached) break;
              }
            }
            const current = (await exec.getExecOutput("git", ["rev-parse", "HEAD"])).stdout.trim();
            const origin = (await exec.getExecOutput("git", ["remote", "get-url", "origin"])).stdout.trim();
            const expected = `${context.serverUrl}/${repo.owner}/${repo.repo}`;
            if (![expected, `${expected}.git`].includes(origin)) throw new Error("Unexpected checkout origin.");
            const token = process.env.PREPARATION_TOKEN;
            if (!token || /\s/.test(token)) throw new Error("Preparation requires the preparation token without whitespace.");
            const header = "AUTHORIZATION: basic " + Buffer.from(`x-access-token:${token}`).toString("base64");
            core.setSecret(header);
            const versions = async () => {
              const result = await exec.getExecOutput("trellis", ["list", "--releasable", "--json"], {
                cwd: process.env.WORKING_DIRECTORY,
              });
              const packages = JSON.parse(result.stdout).packages;
              if (!Array.isArray(packages) || packages.some(p => typeof p.version !== "string")) {
                throw new Error("Invalid releasable package output.");
              }
              return packages;
            };
            const candidate = packages => packages.some(p => p.version.split("+")[0].includes("-"));
            if (!manual) {
              if (candidate(await versions())) { core.info("Candidate base requires a manual request."); return; }
              if (open[0]) {
                if (!/^[0-9a-f]{40}$/.test(open[0].head.sha)) throw new Error("Invalid pending head SHA.");
                const gitEnv = {...process.env};
                let count = Number(gitEnv.GIT_CONFIG_COUNT || "0");
                if (!Number.isSafeInteger(count) || count < 0) throw new Error("Invalid Git config count.");
                for (const value of ["", header]) {
                  gitEnv[`GIT_CONFIG_KEY_${count}`] = `http.${origin}.extraheader`;
                  gitEnv[`GIT_CONFIG_VALUE_${count}`] = value;
                  count++;
                }
                gitEnv.GIT_CONFIG_COUNT = String(count);
                await exec.exec("git", ["fetch", "origin", open[0].head.sha], {env: gitEnv});
                let pendingCandidate;
                try {
                  await exec.exec("git", ["checkout", "--detach", open[0].head.sha]);
                  pendingCandidate = candidate(await versions());
                } finally {
                  await exec.exec("git", ["checkout", base]);
                  const restored = (await exec.getExecOutput("git", ["rev-parse", "HEAD"])).stdout.trim();
                  if (restored !== current) throw new Error("Preparation checkout changed.");
                }
                if (pendingCandidate) { core.info("Pending candidate requires a manual request."); return; }
              }
            }
            if (manual) {
              await github.rest.repos.createCommitStatus({
                ...repo, sha: current, context: "trellis/release_request", state: "pending",
                description: "Manual request owns preparation until merge or explicit abandonment",
              });
              core.setOutput("reservation_sha", current);
              core.setOutput("reservation_shas", JSON.stringify([...new Set([...reservations, current])]));
            }
            core.setOutput("git_header", header);
            core.setOutput("git_origin", origin);
            core.setOutput("prepare", "true");
            // end-script

      - name: Prepare release PR
        id: prepare
        if: steps.gate.outputs.prepare == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          PRE: ${{ github.event_name == 'workflow_dispatch' && inputs.pre || '' }}
          SET: ${{ github.event_name == 'workflow_dispatch' && inputs.set || '' }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || '' }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: http.${{ steps.gate.outputs.git_origin }}.extraheader
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: http.${{ steps.gate.outputs.git_origin }}.extraheader
          GIT_CONFIG_VALUE_1: ${{ steps.gate.outputs.git_header }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // script: prepare
            const args = ["release", "pr", "--base", process.env.RELEASE_BASE,
              "--branch", process.env.RELEASE_BRANCH, "--github-output"];
            const pre = process.env.PRE.trim();
            if (pre) args.push("--pre", pre);
            for (const flag of ["set", "bump"]) {
              for (const line of process.env[flag.toUpperCase()].split(/\r\n|[\n\r]/)) {
                if (line.trim()) args.push(`--${flag}`, line.trim());
              }
            }
            core.summary.addHeading("Trellis release PR", 2);
            try {
              const result = await exec.getExecOutput("trellis", args, {cwd: process.env.WORKING_DIRECTORY});
              const outcome = result.stdout.match(/^outcome=(prepared|unchanged|no_changes)\r?$/m)?.[1];
              if (!outcome) throw new Error("Missing or invalid trellis preparation outcome.");
              core.summary.addRaw(`Preparation outcome: \`${outcome}\`.\n`);
            } catch (error) {
              core.summary.addRaw("Preparation failed; see the step log.\n");
              throw error;
            } finally {
              await core.summary.write();
            }
            // end-script

      - name: Clear successful manual no-op
        if: steps.prepare.outcome == 'success' && steps.gate.outputs.reservation_sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        env:
          RESERVATION_SHAS: ${{ steps.gate.outputs.reservation_shas }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // script: clear-noop
            const repo = context.repo;
            const open = await github.paginate(github.rest.pulls.list, {
              ...repo, state: "open", base: process.env.RELEASE_BASE,
              head: `${repo.owner}:${process.env.RELEASE_BRANCH}`,
            });
            if (open.some(pr => pr.head.repo?.full_name === `${repo.owner}/${repo.repo}`
                && pr.base.repo?.full_name === `${repo.owner}/${repo.repo}`
                && pr.head.ref === process.env.RELEASE_BRANCH && pr.base.ref === process.env.RELEASE_BASE)) return;
            const reservations = JSON.parse(process.env.RESERVATION_SHAS);
            if (!Array.isArray(reservations) || reservations.some(sha => !/^[0-9a-f]{40}$/.test(sha))) {
              throw new Error("Invalid reservation SHAs.");
            }
            for (const sha of reservations) {
              await github.rest.repos.createCommitStatus({
                ...repo, sha, context: "trellis/release_request",
                state: "success", description: "Manual preparation completed without a pending PR",
              });
            }
            // end-script
