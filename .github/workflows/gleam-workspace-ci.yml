name: Gleam Workspace CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label for all jobs'
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        description: 'Repository root directory'
        required: false
        type: string
        default: '.'
      workspace-file:
        description: 'Path to workspace.toml relative to working-directory'
        required: false
        type: string
        default: 'workspace.toml'
      version-file:
        description: 'Path to .tool-versions relative to working-directory'
        required: false
        type: string
        default: '.tool-versions'
      version-type:
        description: 'Version matching mode for setup-gleam'
        required: false
        type: string
        default: 'strict'
      erlang-version:
        description: 'Explicit Erlang/OTP version override'
        required: false
        type: string
        default: ''
      gleam-version:
        description: 'Explicit Gleam version override'
        required: false
        type: string
        default: ''
      elixir-version:
        description: 'Optional Elixir version for Mix-enabled projects'
        required: false
        type: string
        default: ''
      rebar-version:
        description: 'Optional Rebar3 version (used with Elixir)'
        required: false
        type: string
        default: ''
      node:
        description: 'Whether to setup Node.js for JavaScript target'
        required: false
        type: boolean
        default: false
      node-version:
        description: 'Node.js version to install when node=true'
        required: false
        type: string
        default: '22'
      tools:
        description: 'Tools to install via taiki-e/install-action (comma-separated)'
        required: false
        type: string
        default: ''
      run-deps:
        description: 'Whether to install dependencies in each package before running checks'
        required: false
        type: boolean
        default: false
      cache:
        description: 'Whether to enable workspace-aware dependency caching'
        required: false
        type: boolean
        default: false
      fail-fast:
        description: 'Whether the package matrix should stop on first failure'
        required: false
        type: boolean
        default: false
      format-check:
        description: 'Whether to run gleam format --check src test in each package'
        required: false
        type: boolean
        default: false
      check:
        description: 'Whether to run gleam check in each package'
        required: false
        type: boolean
        default: false
      build-strict:
        description: 'Whether to run gleam build --warnings-as-errors in each package'
        required: false
        type: boolean
        default: true
      test:
        description: 'Whether to run gleam test in each package'
        required: false
        type: boolean
        default: false
      test-js:
        description: 'Whether to run gleam test --target javascript in each package (implies node=true)'
        required: false
        type: boolean
        default: false
      docs:
        description: 'Whether to run gleam docs build in each package'
        required: false
        type: boolean
        default: false
      custom-command:
        description: 'Arbitrary shell command to run in each package directory'
        required: false
        type: string
        default: ''
      trellis_version:
        description: 'Exact trellis version; empty preserves legacy workspace.toml CI'
        type: string
        default: ''
      since:
        description: 'Opt-in trellis affected selection base ref/SHA; requires history'
        type: string
        default: ''
      trellis_task:
        description: 'Configured trellis task for each selected package; replaces standard checks by default'
        type: string
        default: ''
      trellis_task_with_checks:
        description: 'Run standard checks and custom-command in addition to trellis_task'
        type: boolean
        default: false
      trellis_check:
        description: 'Run trellis doctor in a separate read-only check job'
        type: boolean
        default: false
      trellis_changelog:
        description: 'Also check changelog; requires trellis_check and explicit base/head'
        type: boolean
        default: false
      trellis_base:
        description: 'Explicit changelog comparison base ref/SHA'
        type: string
        default: ''
      trellis_head:
        description: 'Explicit changelog comparison head ref/SHA'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  discover:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      packages-json: ${{ steps.workspace.outputs.packages-json }}
      matrix: ${{ steps.selection.outputs.matrix }}
      has-packages: ${{ steps.selection.outputs.has_packages }}
      run-checks: ${{ steps.selection.outputs.run_checks }}
    steps:
      - name: Validate workspace mode
        shell: bash
        env:
          TRELLIS_VERSION: ${{ inputs.trellis_version }}
          SINCE: ${{ inputs.since }}
          TASK: ${{ inputs.trellis_task }}
          WITH_CHECKS: ${{ inputs.trellis_task_with_checks }}
          CHECK: ${{ inputs.trellis_check }}
          CHANGELOG: ${{ inputs.trellis_changelog }}
          BASE: ${{ inputs.trellis_base }}
          HEAD: ${{ inputs.trellis_head }}
          WORKSPACE_FILE: ${{ inputs.workspace-file }}
          CUSTOM_COMMAND: ${{ inputs.custom-command }}
        run: |
          # script: validate-mode
          python3 - <<'PY'
          import os
          def reject(message):
              raise SystemExit("::error::" + message)
          enabled = bool(os.environ["TRELLIS_VERSION"])
          task = os.environ["TASK"]
          both = os.environ["WITH_CHECKS"] == "true"
          check = os.environ["CHECK"] == "true"
          changelog = os.environ["CHANGELOG"] == "true"
          if not enabled and (task or both or check or changelog or os.environ["SINCE"]
                              or os.environ["BASE"] or os.environ["HEAD"]):
              reject("trellis-specific settings require an explicit trellis_version")
          if enabled and os.environ["WORKSPACE_FILE"] not in ("", "workspace.toml"):
              reject("workspace-file overrides are ambiguous in trellis mode")
          if task.startswith("-"):
              reject("trellis_task must not start with '-'")
          if both and not task:
              reject("trellis_task_with_checks requires a task")
          if task and os.environ["CUSTOM_COMMAND"] and not both:
              reject("custom-command with trellis_task requires trellis_task_with_checks")
          if changelog and (not check or not os.environ["BASE"] or not os.environ["HEAD"]):
              reject("trellis_changelog requires trellis_check and explicit trellis_base/trellis_head")
          if (os.environ["BASE"] or os.environ["HEAD"]) and not changelog:
              reject("changelog refs require trellis_changelog")
          PY
          # end-script

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.trellis_version != '' && '0' || '1' }}

      - name: Read workspace
        if: inputs.trellis_version == ''
        id: workspace
        uses: tylerbutler/actions/read-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/read-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          workspace-file: ${{ inputs.workspace-file }}

      - name: Install trellis
        if: inputs.trellis_version != ''
        uses: tylerbutler/actions/setup-trellis@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-trellis@main
        with:
          version: ${{ inputs.trellis_version }}

      - name: Discover trellis workspace
        if: inputs.trellis_version != ''
        id: trellis
        uses: tylerbutler/actions/trellis-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/trellis-workspace@main
        with:
          working_directory: ${{ inputs.working-directory }}
          since: ${{ inputs.since }}

      - name: Select matrix
        id: selection
        shell: bash
        env:
          TRELLIS_VERSION: ${{ inputs.trellis_version }}
          TRELLIS_MATRIX: ${{ steps.trellis.outputs.matrix }}
          LEGACY_PACKAGES: ${{ steps.workspace.outputs.packages-json }}
          TASK: ${{ inputs.trellis_task }}
          WITH_CHECKS: ${{ inputs.trellis_task_with_checks }}
        run: |
          # script: select-matrix
          python3 - <<'PY'
          import json, os
          if os.environ["TRELLIS_VERSION"]:
              packages = json.loads(os.environ["TRELLIS_MATRIX"])["include"]
          else:
              packages = json.loads(os.environ["LEGACY_PACKAGES"])
          if not isinstance(packages, list) or any(
              not isinstance(p, dict) or any(not isinstance(p.get(k), str)
              for k in ("name", "path", "version")) for p in packages
          ):
              raise SystemExit("::error::invalid selected workspace matrix")
          checks = not os.environ["TASK"] or os.environ["WITH_CHECKS"] == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"package": packages}) + "\n")
              out.write("has_packages=" + str(bool(packages)).lower() + "\n")
              out.write("run_checks=" + str(checks).lower() + "\n")
          PY
          # end-script

  trellis-check:
    needs: discover
    if: inputs.trellis_version != '' && inputs.trellis_check
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tylerbutler/actions/setup-trellis@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-trellis@main
        with:
          version: ${{ inputs.trellis_version }}
      - uses: tylerbutler/actions/trellis-check@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/trellis-check@main
        with:
          working_directory: ${{ inputs.working-directory }}
          check_changelog: ${{ inputs.trellis_changelog }}
          base: ${{ inputs.trellis_base }}
          head: ${{ inputs.trellis_head }}

  ci:
    needs: discover
    if: needs.discover.outputs.has-packages == 'true'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.package.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.trellis_version != '' && '0' || '1' }}

      - name: Install matrix trellis
        if: inputs.trellis_version != ''
        uses: tylerbutler/actions/setup-trellis@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-trellis@main
        with:
          version: ${{ inputs.trellis_version }}

      - name: Cache Gleam dependencies
        if: inputs.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: |
            ${{ inputs.working-directory }}/${{ matrix.package.path }}/build/packages
            ~/.cache/gleam
          key: gleam-${{ runner.os }}-${{ matrix.package.name }}-${{ hashFiles(format('{0}/**/gleam.toml', inputs.working-directory), format('{0}/**/manifest.toml', inputs.working-directory)) }}
          restore-keys: |
            gleam-${{ runner.os }}-${{ matrix.package.name }}-

      - name: Cache Mix dependencies
        if: inputs.cache && inputs.elixir-version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: |
            ${{ inputs.working-directory }}/${{ matrix.package.path }}/deps
            ${{ inputs.working-directory }}/${{ matrix.package.path }}/_build
          key: mix-${{ runner.os }}-${{ matrix.package.name }}-${{ inputs.elixir-version }}-${{ hashFiles(format('{0}/**/mix.lock', inputs.working-directory)) }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.package.name }}-${{ inputs.elixir-version }}-

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          erlang-version: ${{ inputs.erlang-version }}
          gleam-version: ${{ inputs.gleam-version }}
          elixir-version: ${{ inputs.elixir-version }}
          rebar-version: ${{ inputs.rebar-version }}
          version-file: ${{ github.workspace }}/${{ inputs.working-directory }}/${{ inputs.version-file }}
          version-type: ${{ inputs.version-type }}
          node: ${{ inputs.node || inputs.test-js }}
          node-version: ${{ inputs.node-version }}
          cache: false
          working-directory: ${{ inputs.working-directory }}
          tools: ${{ inputs.tools }}
          run-deps: false

      - name: Download dependencies
        if: inputs.run-deps
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: |
            if [ -f justfile ]; then
              just deps
            elif [ -f mix.exs ]; then
              mix deps.get
            else
              gleam deps download
            fi

      - name: Format check
        if: needs.discover.outputs.run-checks == 'true' && inputs.format-check
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: gleam format --check src test

      - name: Type check
        if: needs.discover.outputs.run-checks == 'true' && inputs.check
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: gleam check

      - name: Build (warnings as errors)
        if: needs.discover.outputs.run-checks == 'true' && inputs.build-strict
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: gleam build --warnings-as-errors

      - name: Test
        if: needs.discover.outputs.run-checks == 'true' && inputs.test
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: gleam test

      - name: Test (JavaScript)
        if: needs.discover.outputs.run-checks == 'true' && inputs.test-js
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: gleam test --target javascript

      - name: Docs
        if: needs.discover.outputs.run-checks == 'true' && inputs.docs
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: gleam docs build

      - name: "${{ inputs.custom-command }}"
        if: needs.discover.outputs.run-checks == 'true' && inputs.custom-command != ''
        uses: tylerbutler/actions/run-gleam-workspace@9d2a7c45ab9c7e04a3ac35445f187840f126ac47 # ratchet:tylerbutler/actions/run-gleam-workspace@main
        with:
          working-directory: ${{ inputs.working-directory }}
          packages: ${{ matrix.package.path }}
          command: ${{ inputs.custom-command }}

      - name: Run configured trellis task
        if: inputs.trellis_task != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TASK: ${{ inputs.trellis_task }}
          PACKAGE: ${{ matrix.package.name }}
        run: |
          # script: run-task
          python3 - <<'PY'
          import os, subprocess
          subprocess.run(["trellis", "run", os.environ["TASK"], os.environ["PACKAGE"]], check=True)
          PY
          # end-script
