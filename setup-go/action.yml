name: 'Setup Go Environment'
description: 'Standardized Go setup with caching and optional mise tool management'

inputs:
  go-version:
    description: 'Go version (ignored if go-version-file is set)'
    required: false
    default: ''
  go-version-file:
    description: 'Path to go.mod or file containing Go version'
    required: false
    default: 'go.mod'
  cache:
    description: 'Whether to cache Go modules'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for dependency download'
    required: false
    default: '.'
  tools:
    description: 'Tools to install via taiki-e/install-action (comma-separated, e.g., "just,cargo-bloat")'
    required: false
    default: 'just'
  install-mise:
    description: 'Whether to install mise and run mise install for project tools'
    required: false
    default: 'false'
  run-deps:
    description: 'Whether to run go mod download'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # ratchet:taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    - name: Setup Go (from version file)
      if: inputs.go-version == ''
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache == 'true' }}

    - name: Setup Go (explicit version)
      if: inputs.go-version != ''
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache == 'true' }}

    - name: Install mise and tools
      if: inputs.install-mise == 'true'
      uses: ./mise-setup
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Download dependencies
      if: inputs.run-deps == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download

    - name: Write step summary
      shell: bash
      run: |
        go_version=$(go version 2>/dev/null | head -1 || echo "unknown")
        {
          echo "## Setup Go Environment"
          echo
          echo "Set up ${go_version}."
        } >> "$GITHUB_STEP_SUMMARY"
