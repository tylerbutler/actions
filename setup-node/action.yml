name: 'Setup Node.js Environment'
description: 'Standardized Node.js setup with pnpm and caching'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  package-manager:
    description: 'Package manager to use: npm, pnpm, yarn, or bun'
    required: false
    default: 'pnpm'
  pnpm-version:
    description: 'pnpm version (only used if package-manager is pnpm)'
    required: false
    default: 'latest'
  cache:
    description: 'Whether to cache dependencies'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for dependency installation'
    required: false
    default: '.'
  tools:
    description: 'Tools to install via taiki-e/install-action (comma-separated, e.g., "just,cargo-bloat")'
    required: false
    default: 'just'
  run-install:
    description: 'Whether to run package install'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # ratchet:taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    - name: Setup pnpm
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # ratchet:pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Bun
      if: inputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && inputs.package-manager || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}

    - name: Install dependencies (pnpm)
      if: inputs.run-install == 'true' && inputs.package-manager == 'pnpm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - name: Install dependencies (npm)
      if: inputs.run-install == 'true' && inputs.package-manager == 'npm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Install dependencies (yarn)
      if: inputs.run-install == 'true' && inputs.package-manager == 'yarn'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn install --frozen-lockfile

    - name: Install dependencies (bun)
      if: inputs.run-install == 'true' && inputs.package-manager == 'bun'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile

    - name: Write step summary
      shell: bash
      run: |
        node_version=$(node --version 2>/dev/null || echo "unknown")
        {
          echo "## Setup Node.js"
          echo
          echo "Set up Node.js ${node_version} with ${{ inputs.package-manager }}."
        } >> "$GITHUB_STEP_SUMMARY"
