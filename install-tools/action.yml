name: 'Install Development Tools'
description: 'Install common development tools via taiki-e/install-action'

inputs:
  tools:
    description: 'Comma-separated list of tools to install (e.g., just,cargo-nextest)'
    required: false
    default: 'just'

runs:
  using: composite
  steps:
    - name: Install Tools
      uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # ratchet:taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    - name: Write step summary
      shell: bash
      run: |
        {
          echo "## Install Development Tools"
          echo
          echo "Installed: \`${{ inputs.tools }}\`."
        } >> "$GITHUB_STEP_SUMMARY"
