name: 'Setup mise and tools'
description: 'Install mise and project-declared tools (.mise.toml / .tool-versions) or ad-hoc tools'

inputs:
  working-directory:
    description: 'Directory where mise should run; usually contains .mise.toml or .tool-versions for project-declared tools'
    required: false
    default: '.'
  experimental:
    description: 'Enable mise experimental features (newer plugins, etc.)'
    required: false
    default: 'true'
  tools:
    description: |
      .tool-versions-style ad-hoc tool versions, e.g.
        node 22
        jq latest
      Forwarded to jdx/mise-action as `tool_versions`. Useful when no .mise.toml exists.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      with:
        experimental: ${{ inputs.experimental }}
        working_directory: ${{ inputs.working-directory }}
        tool_versions: ${{ inputs.tools }}

    - name: Write step summary
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        installed=$(mise list --current 2>/dev/null | head -1 || echo "unknown")
        {
          echo "## mise-setup"
          echo
          echo "Installed: ${installed}"
        } >> "$GITHUB_STEP_SUMMARY"
