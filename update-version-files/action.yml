name: 'Update Version Files'
description: |
  Update version strings in TOML files using the version from the nearest ancestor package.json.
  Supports TOML dotted key paths such as `version` and `package.version`.

inputs:
  files:
    description: |
      Newline-separated list of TOML files and key paths to update.
      Format: `path:key-path`

      The version is auto-detected by walking up from the TOML file's directory
      to find the nearest package.json and reading its `version` field.

      TOML dotted key paths are supported (for example, `version` or
      `package.version`). The requested key path must already exist and point
      to a string value.

      Example:
        packages/my-pkg/Cargo.toml:version
        crates/core/Cargo.toml:package.version
    required: true

runs:
  using: composite
  steps:
    - name: Install toml-cli
      shell: bash
      run: |
        python3 -m pip install --user 'toml-cli==0.8.2'
        echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

    - name: Update version files
      shell: bash
      env:
        VERSION_FILES: ${{ inputs.files }}
      run: python3 "$GITHUB_ACTION_PATH/update_version_files.py"
