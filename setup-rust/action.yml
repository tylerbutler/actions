name: 'Setup Rust Environment'
description: 'Standardized Rust toolchain setup with caching'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'
  components:
    description: 'Rust components to install (comma-separated, e.g., rustfmt,clippy)'
    required: false
    default: ''
  targets:
    description: 'Additional compilation targets (comma-separated)'
    required: false
    default: ''
  cache:
    description: 'Whether to cache Rust artifacts'
    required: false
    default: 'true'
  tools:
    description: 'Tools to install via taiki-e/install-action (comma-separated, e.g., "just,cargo-bloat")'
    required: false
    default: 'just'

runs:
  using: composite
  steps:
    - name: Install tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # ratchet:taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ratchet:dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Setup Rust Cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # ratchet:Swatinem/rust-cache@v2
      with:
        shared-key: rust-${{ runner.os }}-${{ inputs.toolchain }}

    - name: Write step summary
      shell: bash
      run: |
        rust_version=$(rustc --version 2>/dev/null || echo "unknown")
        {
          echo "## Setup Rust Toolchain"
          echo
          echo "Set up ${rust_version}."
        } >> "$GITHUB_STEP_SUMMARY"
