name: 'Setup Rust Environment'
description: 'Standardized Rust toolchain setup with caching'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'
  components:
    description: 'Rust components to install (comma-separated, e.g., rustfmt,clippy)'
    required: false
    default: ''
  targets:
    description: 'Additional compilation targets (comma-separated)'
    required: false
    default: ''
  cache:
    description: 'Whether to cache Rust artifacts'
    required: false
    default: 'true'
  tools:
    description: 'Tools to install via taiki-e/install-action (comma-separated, e.g., "just,cargo-bloat")'
    required: false
    default: 'just'

runs:
  using: composite
  steps:
    - name: Install tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # ratchet:taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Setup Rust Cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      with:
        shared-key: rust-${{ runner.os }}-${{ inputs.toolchain }}

    - name: Write step summary
      shell: bash
      run: |
        rust_version=$(rustc --version 2>/dev/null || echo "unknown")
        {
          echo "## Setup Rust Toolchain"
          echo
          echo "Set up ${rust_version}."
        } >> "$GITHUB_STEP_SUMMARY"
