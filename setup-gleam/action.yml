name: 'Setup Gleam Environment'
description: 'Standardized Gleam/BEAM setup with caching and optional Elixir and Node.js'

inputs:
  erlang-version:
    description: 'Erlang/OTP version (ignored if version-file is set)'
    required: false
    default: ''
  gleam-version:
    description: 'Gleam version (ignored if version-file is set)'
    required: false
    default: ''
  elixir-version:
    description: 'Elixir version to install (optional, enables Elixir/Mix support)'
    required: false
    default: ''
  rebar-version:
    description: 'Rebar3 version to install (optional, used with Elixir)'
    required: false
    default: ''
  version-file:
    description: 'Path to .tool-versions file for version management'
    required: false
    default: '.tool-versions'
  version-type:
    description: 'Version matching type: strict or loose'
    required: false
    default: 'strict'
  node:
    description: 'Whether to setup Node.js for JavaScript target'
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22'
  cache:
    description: 'Whether to cache Gleam dependencies'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for dependency download'
    required: false
    default: '.'
  tools:
    description: 'Tools to install via taiki-e/install-action (comma-separated, e.g., "just,cargo-bloat")'
    required: false
    default: 'just'
  run-deps:
    description: 'Whether to run gleam deps download (or just deps if justfile exists)'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # ratchet:taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}

    - name: Resolve Elixir version
      id: resolve-elixir
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ELIXIR_VERSION_INPUT: ${{ inputs.elixir-version }}
      run: |
        version=$("$GITHUB_ACTION_PATH/resolve_elixir_version.sh")
        echo "elixir-version=$version" >> "$GITHUB_OUTPUT"
        if [[ -n "$version" && -z "$ELIXIR_VERSION_INPUT" ]]; then
          echo "Auto-detected Elixir requirement (mix.exs found): $version"
        fi

    - name: Setup BEAM (from version file)
      if: inputs.version-file != '' && inputs.erlang-version == ''
      uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # ratchet:erlef/setup-beam@v1
      with:
        version-file: ${{ inputs.version-file }}
        version-type: ${{ inputs.version-type }}

    - name: Setup BEAM (explicit versions, Gleam only)
      if: inputs.erlang-version != '' && steps.resolve-elixir.outputs.elixir-version == ''
      uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # ratchet:erlef/setup-beam@v1
      with:
        otp-version: ${{ inputs.erlang-version }}
        gleam-version: ${{ inputs.gleam-version }}

    - name: Setup BEAM (explicit versions, Gleam + Elixir)
      if: inputs.erlang-version != '' && steps.resolve-elixir.outputs.elixir-version != ''
      uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # ratchet:erlef/setup-beam@v1
      with:
        otp-version: ${{ inputs.erlang-version }}
        gleam-version: ${{ inputs.gleam-version }}
        elixir-version: ${{ steps.resolve-elixir.outputs.elixir-version }}
        rebar3-version: ${{ inputs.rebar-version }}

    - name: Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Gleam dependencies
      if: inputs.cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5
      with:
        path: |
          ${{ inputs.working-directory }}/build/packages
          ~/.cache/gleam
        key: gleam-${{ runner.os }}-${{ hashFiles(format('{0}/gleam.toml', inputs.working-directory), format('{0}/manifest.toml', inputs.working-directory)) }}
        restore-keys: |
          gleam-${{ runner.os }}-

    - name: Cache Mix dependencies
      if: inputs.cache == 'true' && steps.resolve-elixir.outputs.elixir-version != ''
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5
      with:
        path: |
          ${{ inputs.working-directory }}/deps
          ${{ inputs.working-directory }}/_build
        key: mix-${{ runner.os }}-${{ steps.resolve-elixir.outputs.elixir-version }}-${{ hashFiles(format('{0}/mix.lock', inputs.working-directory)) }}
        restore-keys: |
          mix-${{ runner.os }}-${{ steps.resolve-elixir.outputs.elixir-version }}-

    - name: Download dependencies (just)
      if: inputs.run-deps == 'true' && hashFiles(format('{0}/justfile', inputs.working-directory)) != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: just deps

    - name: Download dependencies (gleam)
      if: inputs.run-deps == 'true' && hashFiles(format('{0}/justfile', inputs.working-directory)) == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: gleam deps download

    - name: Install Mix dependencies
      if: inputs.run-deps == 'true' && steps.resolve-elixir.outputs.elixir-version != '' && hashFiles(format('{0}/justfile', inputs.working-directory)) == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mix deps.get

    - name: Write step summary
      shell: bash
      run: |
        gleam_version=$(gleam --version 2>/dev/null | head -1 || echo "unknown")
        {
          echo "## Setup Gleam Environment"
          echo
          if [[ -n "${{ steps.resolve-elixir.outputs.elixir-version }}" ]]; then
            echo "Set up ${gleam_version} with Elixir ${{ steps.resolve-elixir.outputs.elixir-version }}."
          else
            echo "Set up ${gleam_version}."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
